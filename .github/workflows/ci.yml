name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  VCPKG_BASELINE: 118bba14b94bc040c098c0c15e63c142148c05ca

jobs:
  build:
    name: Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse-dev ninja-build

      - name: Check out vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_BASELINE }}
          path: vcpkg

      - name: Cache vcpkg build artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Check help
        run: ./build/release/FuseTorrent --help
